name: CI/CD MasterBikes

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  security-events: write

env:
  IMAGE_NAME: masterbikes-api

jobs:
  test:
    name: Pruebas automatizadas
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas unitarias
        run: npm test

  security:
    name: Seguridad y calidad
    runs-on: ubuntu-latest
    needs: test
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Bloquear vulnerabilidades altas o criticas
        run: npm audit --audit-level=high

      - name: Analisis Snyk
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ env.SNYK_TOKEN }}
        with:
          command: test
          args: --severity-threshold=high

  docker:
    name: Build y escaneo Docker
    runs-on: ubuntu-latest
    needs: security

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: docker build -t $IMAGE_NAME:${{ github.sha }} .

      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  deploy-simulado:
    name: Despliegue cloud simulado
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Levantar entorno con Docker Compose
        run: docker compose up -d --build

      - name: Validar healthcheck del microservicio
        run: |
          for i in {1..10}; do
            if curl -fsS http://127.0.0.1:3000/health; then
              exit 0
            fi
            sleep 3
          done
          docker compose logs
          exit 1

      - name: Evidenciar trazabilidad
        run: |
          echo "Repositorio: $GITHUB_REPOSITORY"
          echo "Commit: $GITHUB_SHA"
          echo "Workflow: $GITHUB_WORKFLOW"
          echo "Run: $GITHUB_RUN_NUMBER"
          docker compose ps

      - name: Apagar entorno simulado
        if: always()
        run: docker compose down
