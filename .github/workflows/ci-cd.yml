name: CI/CD MasterBikes

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  security-events: write

env:
  IMAGE_NAME: masterbikes-api

jobs:
  test:
    name: Pruebas automatizadas
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas unitarias
        run: npm test

  security:
    name: Seguridad y calidad
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Bloquear vulnerabilidades altas o críticas
        run: npm audit --audit-level=high

      - name: Analisis SonarCloud
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Verificar Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker:
    name: Build, Escaneo y Push a Docker Hub
    runs-on: ubuntu-latest
    needs: security
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y Subir imagen a Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            zzzouv/masterbikes-api:latest
            zzzouv/masterbikes-api:${{ github.sha }}

      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'zzzouv/masterbikes-api:${{ github.sha }}'
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true

  deploy:
    name: Despliegue automático en AWS EC2 (K3s)
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Desplegar en Kubernetes vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/PruebaIngDev_EduCortes-CrisSalas1

            git fetch origin
            git reset --hard origin/main
            git clean -fd

            sudo kubectl rollout restart deployment masterbikes-api
            sudo kubectl rollout status deployment masterbikes-api
            sleep 5
            sudo kubectl get pods
            sudo kubectl describe deployment masterbikes-api

            curl -fsS http://127.0.0.1:30080/health
            echo "Deployment completado correctamente"